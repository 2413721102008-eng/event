<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIPHER://TRAIL — Server Authentication</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#04070d;
    --panel:rgba(7,16,26,.72);
    --panel-border:rgba(45,216,255,.35);
    --cyan:#2dd8ff;
    --cyan-soft:rgba(45,216,255,.5);
    --cyan-dim:#0f3a47;
    --amber:#ffb454;
    --success:#3dffb0;
    --danger:#ff3b5c;
    --ink:#d6f6ff;
    --ink-dim:#6f93a3;
    --font-display:'Orbitron', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--font-mono); overflow:hidden; position:relative; }
.bg{
    position:fixed; inset:0; z-index:-2;
    background:
        radial-gradient(circle at 50% 20%, rgba(45,216,255,.10), transparent 60%),
        linear-gradient(rgba(45,216,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45,216,255,.06) 1px, transparent 1px);
    background-size:auto, 46px 46px, 46px 46px;
    animation:gridDrift 16s linear infinite;
}
@keyframes gridDrift{ from{background-position:0 0, 0 0, 0 0;} to{background-position:0 0, 0 46px, 46px 0;} }
.scanlines{
    position:fixed; inset:0; z-index:50; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.10) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:overlay;
}
.vignette{ position:fixed; inset:0; z-index:40; pointer-events:none; background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%); }
.stage{ height:100vh; display:flex; justify-content:center; align-items:center; padding:24px; }
.hidden{ display:none !important; }
.terminal{
    width:min(560px, 100%); background:var(--panel); backdrop-filter:blur(18px);
    border:1px solid var(--panel-border); border-radius:14px;
    box-shadow:0 0 0 1px rgba(45,216,255,.08), 0 30px 80px -20px rgba(0,0,0,.8), 0 0 60px -15px rgba(45,216,255,.25);
    overflow:hidden;
}
.chrome{ display:flex; align-items:center; gap:8px; padding:12px 16px; background:rgba(45,216,255,.06); border-bottom:1px solid rgba(45,216,255,.18); }
.chrome-dot{ width:10px; height:10px; border-radius:50%; background:var(--cyan-dim); }
.chrome-dot.live{ background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
.chrome-label{ margin-left:8px; font-size:.72rem; letter-spacing:.14em; color:var(--ink-dim); }
.panel-body{ padding:40px 36px 36px; }
.eyebrow{ display:flex; align-items:center; gap:8px; font-size:.72rem; letter-spacing:.22em; color:var(--cyan); opacity:.8; }
.eyebrow::before{ content:""; width:6px; height:6px; background:var(--cyan); border-radius:50%; box-shadow:0 0 8px var(--cyan); }
.title{ font-family:var(--font-display); font-weight:800; font-size:2.6rem; letter-spacing:.03em; color:var(--cyan); text-shadow:0 0 22px rgba(45,216,255,.55); margin-top:10px; line-height:1.1; }
.title .slash{ color:var(--ink-dim); font-weight:400; }
.subtitle{ margin-top:10px; font-size:.82rem; letter-spacing:.06em; color:var(--ink-dim); }
.otp-row{ display:flex; gap:10px; margin-top:36px; justify-content:center; }
.otp-digit{
    width:52px; height:64px; text-align:center; font-family:var(--font-mono); font-size:1.7rem; font-weight:600;
    color:var(--cyan); background:#050d15; border:1px solid var(--cyan-dim); border-radius:10px; outline:none;
    caret-color:var(--cyan); transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.otp-digit:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(45,216,255,.18), 0 0 16px rgba(45,216,255,.35); transform:translateY(-2px); }
.otp-digit.filled{ border-color:var(--cyan-soft); }
.hexline{ margin-top:18px; text-align:center; font-size:.72rem; letter-spacing:.08em; color:var(--ink-dim); min-height:16px; }
.hexline span{ color:var(--amber); }
.connect-btn{
    display:block; width:100%; margin-top:32px; padding:16px; border:1px solid var(--cyan); border-radius:10px; cursor:pointer;
    font-family:var(--font-mono); font-weight:600; font-size:.82rem; letter-spacing:.16em; color:#04141a;
    background:linear-gradient(90deg, var(--cyan), var(--success)); transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
}
.connect-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 24px -6px rgba(45,216,255,.6); }
.connect-btn:disabled{ opacity:.35; cursor:not-allowed; transform:none; box-shadow:none; }
.hint{ margin-top:16px; text-align:center; font-size:.68rem; color:var(--ink-dim); letter-spacing:.04em; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
.shake{ animation:shake .35s ease; }
#loadingPage .panel-body{ padding:32px 32px 36px; }
.load-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:.72rem; letter-spacing:.1em; color:var(--ink-dim); }
.progress-track{ margin-top:14px; height:6px; border-radius:4px; background:rgba(45,216,255,.12); overflow:hidden; }
.progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--cyan), var(--success)); box-shadow:0 0 10px rgba(45,216,255,.6); transition:width .18s linear; }
.console{ margin-top:20px; height:180px; overflow:hidden; font-size:.76rem; line-height:1.65; color:var(--ink-dim); }
.console div{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.console .ok{ color:var(--success); }
.console .tag{ color:var(--cyan); }
.console .num{ color:var(--amber); }
.spinner-row{ margin-top:18px; display:flex; align-items:center; gap:10px; font-size:.78rem; color:var(--cyan); letter-spacing:.08em; }
.dotspin{ display:inline-flex; gap:4px; }
.dotspin i{ width:6px; height:6px; border-radius:50%; background:var(--cyan); animation:pulseDot 1.1s ease-in-out infinite; }
.dotspin i:nth-child(2){animation-delay:.15s;}
.dotspin i:nth-child(3){animation-delay:.3s;}
@keyframes pulseDot{ 0%,80%,100%{opacity:.2; transform:scale(.7);} 40%{opacity:1; transform:scale(1);} }
#resultPage .panel-body{ text-align:center; padding:48px 36px 42px; }
.result-icon{ width:64px; height:64px; margin:0 auto 18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-family:var(--font-display); }
.result-icon.ok{ color:var(--success); border:1px solid var(--success); box-shadow:0 0 26px rgba(61,255,176,.45); }
.result-icon.bad{ color:var(--danger); border:1px solid var(--danger); box-shadow:0 0 26px rgba(255,59,92,.45); }
.result-title{ font-family:var(--font-display); font-weight:800; font-size:2.1rem; letter-spacing:.04em; }
.result-title.ok{ color:var(--success); text-shadow:0 0 22px rgba(61,255,176,.5); }
.result-title.bad{ color:var(--danger); text-shadow:0 0 22px rgba(255,59,92,.5); }
.result-sub{ margin-top:10px; font-size:.84rem; color:var(--ink-dim); letter-spacing:.02em; }
.session-card{ margin-top:26px; padding:16px 18px; border:1px dashed rgba(61,255,176,.4); border-radius:10px; background:rgba(61,255,176,.05); text-align:left; font-size:.74rem; color:var(--ink-dim); }
.session-card div + div{ margin-top:6px; }
.session-card b{ color:var(--success); letter-spacing:.05em; }
.retry-btn{
    margin-top:28px; padding:14px 30px; border:1px solid var(--danger); border-radius:10px; background:transparent;
    color:var(--danger); font-family:var(--font-mono); font-weight:600; font-size:.78rem; letter-spacing:.14em; cursor:pointer; transition:.2s ease;
}
.retry-btn:hover{ background:rgba(255,59,92,.1); box-shadow:0 0 18px rgba(255,59,92,.3); }
.glitch-shake{ animation:glitchShake .5s ease; }
@keyframes glitchShake{ 0%,100%{transform:translate(0,0);} 20%{transform:translate(-3px,2px);} 40%{transform:translate(3px,-2px);} 60%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} }
canvas#fx{ position:fixed; inset:0; z-index:30; pointer-events:none; }
@media (max-width:480px){ .otp-digit{ width:40px; height:54px; font-size:1.3rem; } .title{ font-size:2rem; } }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; } .bg{ animation:none; } }
</style>
</head>
<body>

<div class="bg"></div>
<div class="scanlines"></div>
<div class="vignette"></div>
<canvas id="fx"></canvas>

<!-- PAGE 1: LOGIN -->
<div id="loginPage" class="stage">
    <div class="terminal">
        <div class="chrome">
            <span class="chrome-dot live"></span>
            <span class="chrome-dot"></span>
            <span class="chrome-dot"></span>
            <span class="chrome-label">SECURE_SHELL // node-07.cipher</span>
        </div>
        <div class="panel-body">
            <div class="eyebrow">FINAL SERVER AUTHENTICATION</div>
            <h1 class="title">CIPHER<span class="slash">://</span>TRAIL</h1>
            <p class="subtitle">Enter the 6-digit access key to establish a connection.</p>

            <div class="otp-row" id="otpRow">
                <input class="otp-digit" inputmode="numeric" maxlength="1" data-i="0" aria-label="Digit 1">
                <input class="otp-digit" inputmode="numeric" maxlength="1" data-i="1" aria-label="Digit 2">
                <input class="otp-digit" inputmode="numeric" maxlength="1" data-i="2" aria-label="Digit 3">
                <input class="otp-digit" inputmode="numeric" maxlength="1" data-i="3" aria-label="Digit 4">
                <input class="otp-digit" inputmode="numeric" maxlength="1" data-i="4" aria-label="Digit 5">
                <input class="otp-digit" inputmode="numeric" maxlength="1" data-i="5" aria-label="Digit 6">
            </div>

            <div class="hexline" id="hexLine">HEX &nbsp;<span>--&nbsp;--&nbsp;--&nbsp;--&nbsp;--&nbsp;--</span></div>

            <button class="connect-btn" id="connectBtn" onclick="startVerification()" disabled>
                CONNECT TO SERVER
            </button>
            <p class="hint">Access keys are issued by your game master.</p>
        </div>
    </div>
</div>

<!-- PAGE 2: LOADING -->
<div id="loadingPage" class="stage hidden">
    <div class="terminal">
        <div class="chrome">
            <span class="chrome-dot live"></span>
            <span class="chrome-dot live"></span>
            <span class="chrome-dot"></span>
            <span class="chrome-label">DECRYPTING // please wait</span>
        </div>
        <div class="panel-body">
            <div class="load-head">
                <span>DECRYPTING ACCESS KEY</span>
                <span id="pct">0%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

            <div class="console" id="console"></div>

            <div class="spinner-row">
                <span class="dotspin"><i></i><i></i><i></i></span>
                <span>ROUTING THROUGH 4 RELAYS</span>
            </div>
        </div>
    </div>
</div>

<!-- PAGE 3: RESULT -->
<div id="resultPage" class="stage hidden">
    <div class="terminal">
        <div class="chrome">
            <span class="chrome-dot" id="chromeDot"></span>
            <span class="chrome-dot"></span>
            <span class="chrome-dot"></span>
            <span class="chrome-label" id="chromeLabel">CONNECTION // closed</span>
        </div>
        <div class="panel-body" id="resultBody">
            <div id="resultIcon" class="result-icon"></div>
            <h1 id="resultTitle" class="result-title"></h1>
            <p id="resultSub" class="result-sub"></p>
            <div id="sessionCard" class="session-card hidden"></div>
            <button class="retry-btn hidden" id="retryBtn" onclick="resetFlow()">TRY AGAIN</button>
        </div>
    </div>
</div>

<script>
/* ===================================================== */
/* THIS IS TEAM 13 — the only line that changes per file */
const TEAM_ID = "team7";
/* ===================================================== */

const otpInputs = Array.from(document.querySelectorAll(".otp-digit"));
const hexSpan   = document.querySelector("#hexLine span");
const connectBtn = document.getElementById("connectBtn");
const otpRow = document.getElementById("otpRow");

otpInputs.forEach((input, idx)=>{
    input.addEventListener("input", (e)=>{
        input.value = input.value.replace(/[^0-9]/g,"").slice(0,1);
        input.classList.toggle("filled", input.value.length===1);
        if(input.value && idx < otpInputs.length-1){
            otpInputs[idx+1].focus();
        }
        updateHexPreview();
    });

    input.addEventListener("keydown", (e)=>{
        if(e.key === "Backspace" && !input.value && idx>0){
            otpInputs[idx-1].focus();
        }
        if(e.key === "Enter" && !connectBtn.disabled){
            startVerification();
        }
    });

    input.addEventListener("paste", (e)=>{
        e.preventDefault();
        const digits = (e.clipboardData.getData("text").match(/\d/g) || []).slice(0,6);
        digits.forEach((d,i)=>{
            if(otpInputs[i]){
                otpInputs[i].value = d;
                otpInputs[i].classList.add("filled");
            }
        });
        const next = Math.min(digits.length, otpInputs.length-1);
        otpInputs[next].focus();
        updateHexPreview();
    });
});

function currentCode(){
    return otpInputs.map(i=>i.value).join("");
}

function updateHexPreview(){
    const code = currentCode();
    const parts = otpInputs.map(i=> i.value ? parseInt(i.value,10).toString(16).toUpperCase().padStart(2,"0") : "--");
    hexSpan.textContent = parts.join(" ");
    connectBtn.disabled = code.length !== 6;
}

const consoleLines = [
    ["ESTABLISHING", "handshake with node-07.cipher"],
    ["PROBE", "port 8443 :: response 200"],
    ["ROUTE", "relay 1/4 :: latency 42ms"],
    ["ROUTE", "relay 2/4 :: latency 61ms"],
    ["ROUTE", "relay 3/4 :: latency 38ms"],
    ["ROUTE", "relay 4/4 :: latency 55ms"],
    ["CIPHER", "loading key schedule AES-256"],
    ["CIPHER", "rounds complete 14/14"],
    ["VERIFY", "matching access key against ledger"],
];

const ANIM_DURATION = 2600; // ms, purely cosmetic minimum display time

function startVerification(){
    const code = currentCode();
    if(code.length !== 6){
        otpRow.classList.add("shake");
        setTimeout(()=>otpRow.classList.remove("shake"), 400);
        return;
    }

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("loadingPage").classList.remove("hidden");

    runConsole();

    // Fire the real request immediately, in parallel with the animation.
    const requestPromise = submitCode(code);

    // Purely cosmetic minimum wait so the animation never feels instant/skipped.
    const minAnimPromise = new Promise(resolve => setTimeout(resolve, ANIM_DURATION));

    // Show the result as soon as BOTH are done — whichever takes longer wins,
    // instead of always waiting the full animation time before even asking the server.
    Promise.all([requestPromise, minAnimPromise]).then(([success]) => {
        showResult(success);
    });
}

function runConsole(){
    const box = document.getElementById("console");
    const fill = document.getElementById("progressFill");
    const pctLabel = document.getElementById("pct");
    box.innerHTML = "";

    let step = 0;
    const total = consoleLines.length;

    const interval = setInterval(()=>{
        if(step >= total){
            clearInterval(interval);
            return;
        }
        const [tag, msg] = consoleLines[step];
        const line = document.createElement("div");
        line.innerHTML = `<span class="tag">[${tag}]</span> ${msg} <span class="ok">OK</span>`;
        box.appendChild(line);
        if(box.children.length > 6){ box.removeChild(box.firstChild); }

        step++;
        const pct = Math.round((step/total)*100);
        fill.style.width = pct + "%";
        pctLabel.textContent = pct + "%";
    }, ANIM_DURATION/total);
}

/* ---------------- SERVER-VERIFIED CHECK ---------------- */
/* Fires immediately when startVerification() runs — no longer waits
   for the 2.6s animation to finish first. Resolves to true/false. */
function getServerBaseUrl(){
    const params = new URLSearchParams(window.location.search);
    const serverParam = params.get("server");
    if (serverParam) {
        return serverParam.replace(/\/$/, "");
    }
    if (window.location.protocol === "http:" || window.location.protocol === "https:") {
        return `${window.location.protocol}//${window.location.hostname}${window.location.port ? ":" + window.location.port : ""}`;
    }
    return "http://192.168.1.34:5000";
}

async function submitCode(code){
    try{
        const res = await fetch(`${getServerBaseUrl()}/api/submit`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ team_id: TEAM_ID, code: code })
        });
        const data = await res.json();
        console.log("Server response:", data);
        return !!data.success;
    }catch(err){
        console.error("Submit failed:", err);
        return false;
    }
}

function showResult(success){
    document.getElementById("loadingPage").classList.add("hidden");
    const resultPage = document.getElementById("resultPage");
    resultPage.classList.remove("hidden");

    const icon = document.getElementById("resultIcon");
    const title = document.getElementById("resultTitle");
    const sub = document.getElementById("resultSub");
    const sessionCard = document.getElementById("sessionCard");
    const retryBtn = document.getElementById("retryBtn");
    const chromeDot = document.getElementById("chromeDot");
    const chromeLabel = document.getElementById("chromeLabel");
    const resultBody = document.getElementById("resultBody");

    if(success){
        icon.className = "result-icon ok";
        icon.textContent = "✓";
        title.className = "result-title ok";
        title.textContent = "ACCESS GRANTED";
        sub.textContent = "Handshake complete. You are connected to the server.";

        chromeDot.classList.add("live");
        chromeDot.style.background = "var(--success)";
        chromeDot.style.boxShadow = "0 0 8px var(--success)";
        chromeLabel.textContent = "CONNECTION // established";

        const sessionKey = Array.from({length:16}, ()=> "0123456789ABCDEF"[Math.floor(Math.random()*16)]).join("");
        sessionCard.classList.remove("hidden");
        sessionCard.innerHTML = `
            <div><b>SESSION</b> :: active</div>
            <div><b>NODE</b> :: node-07.cipher</div>
            <div><b>KEY</b> :: ${sessionKey}</div>
        `;

        launchFireworks();
    }else{
        icon.className = "result-icon bad";
        icon.textContent = "✕";
        title.className = "result-title bad";
        title.textContent = "ACCESS DENIED";
        sub.textContent = "Key rejected by node-07.cipher. Error code 0x1A3.";

        resultBody.classList.add("glitch-shake");
        retryBtn.classList.remove("hidden");

        chromeLabel.textContent = "CONNECTION // refused";
    }
}

function resetFlow(){
    otpInputs.forEach(i=>{ i.value=""; i.classList.remove("filled"); });
    updateHexPreview();
    document.getElementById("resultPage").classList.add("hidden");
    document.getElementById("resultBody").classList.remove("glitch-shake");
    document.getElementById("sessionCard").classList.add("hidden");
    document.getElementById("retryBtn").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");
    otpInputs[0].focus();
}

const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener("resize", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

const GLYPHS = "01ABCDEF#$%&";
let particles = [];

function launchFireworks(){
    for(let j=0;j<7;j++){
        setTimeout(()=>{
            const cx = Math.random()*canvas.width;
            const cy = Math.random()*canvas.height*0.5;
            const colors = ["#2dd8ff", "#3dffb0", "#ffb454"];
            for(let i=0;i<70;i++){
                particles.push({
                    x:cx, y:cy,
                    vx:(Math.random()-0.5)*10,
                    vy:(Math.random()-0.5)*10,
                    life:90,
                    glyph:GLYPHS[Math.floor(Math.random()*GLYPHS.length)],
                    color:colors[Math.floor(Math.random()*colors.length)],
                    size:12+Math.random()*8
                });
            }
        }, j*450);
    }
}

function animate(){
    requestAnimationFrame(animate);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life--;

        ctx.globalAlpha = Math.max(p.life/90, 0);
        ctx.fillStyle = p.color;
        ctx.font = `${p.size}px 'JetBrains Mono', monospace`;
        ctx.fillText(p.glyph, p.x, p.y);
        ctx.globalAlpha = 1;

        if(p.life<=0) particles.splice(i,1);
    }
}
animate();

/* init */
updateHexPreview();
otpInputs[0].focus();
</script>

</body>
</html>
